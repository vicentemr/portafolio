<section class="hero wrap">
  <div>
    <h1 class="reveal" style="--i: 0">
      <span class="intro">Hola, soy <span class="mark">Vicente Mori</span>.</span>
      Construyo <span class="mark">software empresarial</span> que integra, automatiza y escala.
    </h1>
    <p class="lead reveal" style="--i: 1">{{ profile.description }}</p>
    <div class="actions reveal" style="--i: 2">
      <a class="btn btn-primary" href="#contacto" (click)="changeEstadoNav($event, 'contacto')">
        Contáctame <app-icon name="arrowRight" [size]="18" />
      </a>
      <a class="btn btn-ghost" href="#proyectos" (click)="changeEstadoNav($event, 'proyectos')">Ver proyectos</a>
    </div>
  </div>
  <div class="stage reveal" style="--i: 1">
    <div class="disc"></div>
    <div class="mask"><img [src]="profile.photo" alt="Retrato de Vicente Mori" fetchpriority="high"></div>
    @for (stat of stats; track stat.label; let i = $index) {
      <div class="stat reveal" [class]="'stat-' + (i + 1)" [style.--i]="i + 3"><b>{{ stat.value }}</b><span>{{ stat.label }}</span></div>
    }
  </div>
</section>
