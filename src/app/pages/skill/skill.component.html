<section class="skills section">
  <h2 class="section_title">Habilidades</h2>
  <span class="section_subtitle">Mi nivel en tecnologias</span>
  <div class="skills_container containerPersonal grid">

      <!-- primera habilidad -->
      <div (click)="cambioOpenLIst('frontend')" [ngClass]="openList ==='frontend' ? 'skills_open': 'skills_close'"
          class="skills_content">
          <div class="skills_header">
              <i class="fas fa-code skills_icon"></i>
              <div>
                  <h1 class="skills_titles">Desarrollador frontend</h1>
                  <span class="skills_subtitle">Mas de 6 años </span>
              </div>

              <i class="fas fa-chevron-down skills_arrow"></i>
          </div>

          <div class="skills_list grid">
              <div class="skills_data">
                  <div class="skills_titles">
                      <h3 class="skills_name">HTML</h3>
                      <span class="skills_number">90%</span>
                  </div>
                  <div class="skills_bar">
                      <span class="skills_percentage skills_html">

                      </span>
                  </div>
              </div>
              <div class="skills_data">
                  <div class="skills_titles">
                      <h3 class="skills_name">CSS</h3>
                      <span class="skills_number">80%</span>
                  </div>
                  <div class="skills_bar">
                      <span class="skills_percentage skills_css">

                      </span>
                  </div>
              </div>
              <div class="skills_data">
                  <div class="skills_titles">
                      <h3 class="skills_name">Javascript</h3>
                      <span class="skills_number">90%</span>
                  </div>
                  <div class="skills_bar">
                      <span class="skills_percentage skills_js">

                      </span>
                  </div>
              </div>
              <div class="skills_data">
                  <div class="skills_titles">
                      <h3 class="skills_name">Angular</h3>
                      <span class="skills_number">95%</span>
                  </div>
                  <div class="skills_bar">
                      <span class="skills_percentage skills_angular">

                      </span>
                  </div>
              </div>
          </div>

      </div>




      <!-- segunda habilidad -->
      <div (click)="cambioOpenLIst('backend')" class="skill_content "
          [ngClass]="openList ==='backend' ? 'skills_open': 'skills_close'">
          <div class="skills_header">
              <i class="fas fa-server skills_icon"></i>
              <div>
                  <h1 class="skills_titles">Desarrollador backend</h1>
                  <span class="skills_subtitle">Mas de 5 años </span>
              </div>

              <i class="fas fa-chevron-down skills_arrow"></i>
          </div>

          <div class="skills_list grid">
              <div class="skills_data">
                  <div class="skills_titles">
                      <h3 class="skills_name">PHP</h3>
                      <span class="skills_number">90%</span>
                  </div>
                  <div class="skills_bar">
                      <span class="skills_percentage skills_php">

                      </span>
                  </div>
              </div>
              <div class="skills_data">
                  <div class="skills_titles">
                      <h3 class="skills_name">NodeJs</h3>
                      <span class="skills_number">80%</span>
                  </div>
                  <div class="skills_bar">
                      <span class="skills_percentage skills_nodejs">

                      </span>
                  </div>
              </div>
              <div class="skills_data">
                  <div class="skills_titles">
                      <h3 class="skills_name">Firebase</h3>
                      <span class="skills_number">90%</span>
                  </div>
                  <div class="skills_bar">
                      <span class="skills_percentage skills_firebase">

                      </span>
                  </div>
              </div>
              <div class="skills_data">
                  <div class="skills_titles">
                      <h3 class="skills_name">python</h3>
                      <span class="skills_number">95%</span>
                  </div>
                  <div class="skills_bar">
                      <span class="skills_percentage skills_python">

                      </span>
                  </div>
              </div>
          </div>

      </div>


      <!-- tercera habilidad -->
      <div (click)="cambioOpenLIst('diseño')" class="skill_content "
          [ngClass]="openList ==='diseño' ? 'skills_open': 'skills_close'">
          <div class="skills_header">

              <i class="fas fa-swatchbook skills_icon"></i>
              <div>
                  <h1 class="skills_titles">Diseñador</h1>
                  <span class="skills_subtitle">Mas de 4 años </span>
              </div>

              <i class="fas fa-chevron-down skills_arrow"></i>
          </div>

          <div class="skills_list grid">
              <div class="skills_data">
                  <div class="skills_titles">
                      <h3 class="skills_name">Figma</h3>
                      <span class="skills_number">90%</span>
                  </div>
                  <div class="skills_bar">
                      <span class="skills_percentage skills_figma">

                      </span>
                  </div>
              </div>
              <div class="skills_data">
                  <div class="skills_titles">
                      <h3 class="skills_name">Sketch</h3>

                      </span>
                  </div>
              </div>
              <div class="skills_data">
                  <div class="skills_titles">
                      <h3 class="skills_name">Photoshop</h3>

                  </div>
                  <div class="skills_bar">
                      <span class="skills_percentage skills_photoshop">

                      </span>
                  </div>
              </div>
          </div>

      </div>
  </div>
