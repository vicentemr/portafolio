<section class="section wrap">
  <div class="two-col">
    <div>
      <div class="section-head">
        <h2>Acerca de mí</h2>
      </div>
      <div class="about-text">
        @for (paragraph of about.paragraphs; track $index) {
          <p>{{ paragraph }}</p>
        }
      </div>
    </div>
    <div>
      <dl class="about-facts">
        @for (fact of about.facts; track fact.label) {
          <div>
            <dt>{{ fact.label }}</dt>
            <dd>{{ fact.value }}</dd>
          </div>
        }
      </dl>
      <div class="about-interests">
        <h3>Fuera del código</h3>
        <p>{{ about.interests }}</p>
      </div>
    </div>
  </div>
</section>
