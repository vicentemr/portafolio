<section class="contact section">
  <h2 class="section_title">Contáctame</h2>
  <span class="section_subtitle">Ponte en contacto</span>
  <div class="contact_container containerPersonal grid">
      <div>
          <div class="contact_information">
              <i class="fas fa-phone contact_icon"></i>
              <div>
                  <h3 class="contact_title">Teléfono</h3>
                  <span class="contact_subtitle">+51 990579194</span>
              </div>

          </div>

          <div class="contact_information">
              <i class="fas fa-envelope contact_icon"></i>
              <div>
                  <h3 class="contact_title">Correo</h3>
                  <span class="contact_subtitle">vomoro96&#64;gmail.com</span>
              </div>

          </div>

          <div class="contact_information">
              <i class="fas fa-map-marker-alt contact_icon"></i>
              <div>
                  <h3 class="contact_title">Ubicacion</h3>
                  <span class="contact_subtitle">Lima, Perú. Jirón Julio Delgado 301. - ZIP: 15103</span>
              </div>

          </div>
      </div>
      <form action="" class="contact_form grid">
          <div class="contact_inputs grid">
              <div class="contact_content">
                  <label for="Nombre" class="contact_label">Nombre</label>
                  <input type="text" class="contact_input">
              </div>
              <div class="contact_content">
                  <label for="Nombre" class="contact_label">Correo</label>
                  <input type="email" class="contact_input">
              </div>
          </div>
          <div class="contact_content">
              <label for="Nombre" class="contact_label">Proyecto</label>
              <input type="text" class="contact_input">
          </div>
          <div class="contact_content">
              <label for="Nombre" class="contact_label">Mensaje</label>
              <textarea name="" id="" cols="0" rows="7" class="contact_input"></textarea>
          </div>
          <div>
              <a href="" class="button button--flex">
                  Enviar mensaje
                  <fa-icon [icon]="faCommentDots" class="button_icon"></fa-icon>
              </a>
          </div>
      </form>

  </div>
</section>
