<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-labelledby="t">
  <title id="t">Vicente Mori — monograma VM en escudo</title>
  <style>
    svg { --h: 255; --c: 0.19; }
    .mark { transform-origin: 120px 150px; animation: beat 3.2s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .base { color: oklch(0.36 calc(var(--c) * 0.45) var(--h)); fill: currentColor; stroke: currentColor; stroke-width: 1; animation: flash 3.2s linear infinite; }
    .trail { fill: none; stroke: oklch(0.8 calc(var(--c) * 0.7) var(--h)); stroke-width: 40; stroke-dasharray: 100 100; animation: trail 3.2s cubic-bezier(0.45, 0, 0.25, 1) infinite; }
    .comet { fill: none; stroke: oklch(0.98 0.03 var(--h)); stroke-width: 16; stroke-linecap: round; stroke-dasharray: 5 195; filter: url(#glow); animation: comet 3.2s cubic-bezier(0.45, 0, 0.25, 1) infinite; }
    @keyframes trail {
      0%, 8% { stroke-dashoffset: 100; opacity: 1; }
      68%, 80% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes comet {
      0%, 8% { stroke-dashoffset: 5; opacity: 0; }
      10%, 66% { opacity: 1; }
      68%, 100% { stroke-dashoffset: -95; opacity: 0; }
    }
    @keyframes flash {
      0%, 68% { color: oklch(0.36 calc(var(--c) * 0.45) var(--h)); }
      72% { color: oklch(0.9 calc(var(--c) * 0.5) var(--h)); }
      100% { color: oklch(0.36 calc(var(--c) * 0.45) var(--h)); }
    }
    @keyframes beat {
      0%, 68% { transform: scale(1); }
      72% { transform: scale(1.035); }
      90%, 100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark, .base { animation: none; }
      .base { color: oklch(0.8 calc(var(--c) * 0.7) var(--h)); }
      .trail, .comet { display: none; }
    }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
